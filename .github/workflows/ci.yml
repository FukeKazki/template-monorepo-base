name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # apps/api の実装から OpenAPI を再生成し、コミット済みの契約とズレていないか検証する
      - run: pnpm --filter @repo/api run openapi

      - run: git diff --exit-code apps/api/openapi.json

      - run: pnpm -r run test:unit

      - run: pnpm build
