openapi: 3.1.0
info:
  title: Product Management API
  version: 0.0.0
paths:
  /products:
    get:
      operationId: listProducts
      summary: 商品一覧を取得する
      responses:
        "200":
          description: 商品一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      summary: 商品を登録する
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: 登録した商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      summary: 商品詳細を取得する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: 商品詳細
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: 商品が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    put:
      operationId: updateProduct
      summary: 商品を更新する
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: 更新した商品
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: 商品が見つからない
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - imageUrl
      properties:
        id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        price:
          type: number
        imageUrl:
          type: string
          format: uri
          minLength: 1
    CreateProductRequest:
      type: object
      required:
        - name
        - price
        - imageUrl
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: number
        imageUrl:
          type: string
          format: uri
          minLength: 1
    UpdateProductRequest:
      type: object
      required:
        - name
        - price
        - imageUrl
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: number
        imageUrl:
          type: string
          format: uri
          minLength: 1
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
