openapi: 3.1.0
info:
  title: Product Management API
  version: 0.0.0
paths:
  /products:
    get:
      operationId: listProducts
      summary: 商品一覧を取得する
      responses:
        "200":
          description: 商品一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
components:
  schemas:
    Product:
      type: object
      required:
        - name
        - price
        - imageUrl
      properties:
        name:
          type: string
          minLength: 1
        price:
          type: number
        imageUrl:
          type: string
          format: uri
          minLength: 1
